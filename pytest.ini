[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    smoke: quick sanity checks
    login: tests related to login/logout flow
    regression: full regression suite

; Auto-generate a self-contained HTML report on every run
addopts = --html=reports/report.html --self-contained-html -v

log_cli = true
log_cli_level = INFO
